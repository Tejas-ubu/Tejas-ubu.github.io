          }}>
            <div style={{ maxWidth: 800, margin: "0 auto" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                <span style={{ fontSize: 22 }}>📐</span>
                <h1 style={{ margin: 0, fontSize: "clamp(16px, 4vw, 22px)", fontWeight: 900, color: "#f8fafc", textTransform: "uppercase" }}>
                  CS2203 Optimisation Guide
                </h1>
              </div>
              <p style={{ margin: "0 0 14px", color: "#94a3b8", fontSize: 12 }}>
                Syllabus-Aligned Edition · Step-by-step methods · Formulas
              </p>
              
              {/* Filter Buttons */}
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                <button
                  onClick={() => { setActiveQ(null); setExpandedMethod(null); }}
                  style={{
                    padding: "5px 12px", borderRadius: 20, cursor: "pointer", fontSize: 11, fontWeight: activeQ === null ? 700 : 400,
                    border: `1px solid ${activeQ === null ? "#94a3b8" : "#334155"}`,
                    background: activeQ === null ? "#334155" : "transparent",
                    color: activeQ === null ? "#f1f5f9" : "#64748b"
                  }}>ALL</button>
                {topics.map((t, i) => (
                  <button key={i}
                    onClick={() => { setActiveQ(activeQ === i ? null : i); setExpandedMethod(null); }}
                    style={{
                      padding: "5px 12px", borderRadius: 20, cursor: "pointer", fontSize: 11, fontWeight: activeQ === i ? 700 : 400,
                      border: `1px solid ${activeQ === i ? t.color : "#334155"}`,
                      background: activeQ === i ? t.color + "33" : "transparent",
                      color: activeQ === i ? t.color : "#64748b"
                    }}>{t.q}</button>
                ))}
              </div>
            </div>
          </div>

          {/* Content */}
          <div style={{ maxWidth: 800, margin: "0 auto", padding: "20px 16px 60px" }}>
            {activeTopics.map((topic, ti) => {
              const topicIdx = topics.indexOf(topic);
              return (
                <div key={topicIdx} style={{ marginBottom: 32 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14, paddingBottom: 10, borderBottom: `2px solid ${topic.color}40` }}>
                    <span style={{ background: topic.color, color: "#fff", fontWeight: 900, fontSize: 12, padding: "4px 10px", borderRadius: 4 }}>{topic.q}</span>
                    <h2 style={{ margin: 0, fontSize: "clamp(14px, 3.5vw, 18px)", fontWeight: 700, color: topic.color }}>{topic.title}</h2>
                  </div>

                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {topic.methods.map((method, mi) => {
                      const key = `${topicIdx}-${mi}`;
                      const isOpen = expandedMethod === key;
                      return (
                        <div key={mi} style={{ background: isOpen ? "#111827" : "#0f172a", border: `1px solid ${isOpen ? topic.color + "60" : "#1e293b"}`, borderRadius: 10, overflow: "hidden" }}>
                          
                          {/* Accordion Header */}
                          <div onClick={() => setExpandedMethod(isOpen ? null : key)} style={{ padding: "14px 16px", display: "flex", alignItems: "center", gap: 10, cursor: "pointer", userSelect: "none" }}>
                            <span style={{ width: 22, height: 22, borderRadius: "50%", background: topic.color + "25", border: `1px solid ${topic.color}50`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: topic.color, fontWeight: 700 }}>{mi + 1}</span>
                            <div style={{ flex: 1, fontWeight: 700, fontSize: "clamp(12px, 3vw, 14px)", color: "#f1f5f9" }}>{method.name}</div>
                            <span style={{ fontSize: 10, padding: "2px 7px", borderRadius: 10, background: (tagColors[method.tag] || "#334155") + "25", color: tagColors[method.tag] || "#94a3b8", border: `1px solid ${(tagColors[method.tag] || "#334155")}40` }}>{method.tag}</span>
                            <span style={{ color: "#475569", fontSize: 14, marginLeft: 4 }}>{isOpen ? "▲" : "▼"}</span>
                          </div>

                          {/* Accordion Content */}
                          {isOpen && (
                            <div style={{ padding: "0 16px 18px", borderTop: `1px solid ${topic.color}20` }}>
                              <div style={{ background: "#1e293b", borderRadius: 8, padding: "10px 14px", margin: "14px 0", borderLeft: `3px solid ${topic.color}` }}>
                                <div style={{ fontSize: 10, color: topic.color, fontWeight: 700, marginBottom: 5 }}>THEORY</div>
                                <div style={{ fontSize: "12px", color: "#cbd5e1", lineHeight: 1.6 }}>{method.theory}</div>
                              </div>

                              <div style={{ background: "#0d1117", border: `1px solid ${topic.color}40`, borderRadius: 8, padding: "10px 14px", marginBottom: 14, textAlign: "center" }}>
                                <div style={{ fontSize: 10, color: "#64748b", marginBottom: 6 }}>KEY FORMULA</div>
                                <code style={{ fontSize: "13px", color: "#fbbf24" }}>{method.keyFormula}</code>
                              </div>

                              <div style={{ marginBottom: 14 }}>
                                <div style={{ fontSize: 10, color: "#64748b", fontWeight: 700, marginBottom: 10 }}>STEPS</div>
                                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                                  {method.steps.map((step, si) => {
                                    const isSubStep = step.startsWith("  →") || step.startsWith("  ");
                                    const isLabel = !isSubStep && step.endsWith(":") && !step.includes("→");
                                    return (
                                      <div key={si} style={{ display: "flex", gap: 10, alignItems: "flex-start", paddingLeft: isSubStep ? 20 : 0 }}>
                                        {!isSubStep && !isLabel && ( <span style={{ minWidth: 20, height: 20, background: topic.color, color: "#fff", borderRadius: 4, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, marginTop: 1 }}>{si + 1}</span> )}
                                        {isSubStep && ( <span style={{ color: topic.color, fontSize: 12, marginTop: 3 }}>→</span> )}
                                        {isLabel && ( <span style={{ color: topic.color, fontSize: 12, marginTop: 3 }}>◆</span> )}
                                        <span style={{ fontSize: "12px", color: isLabel ? topic.color : "#cbd5e1", lineHeight: 1.55, fontWeight: isLabel ? 700 : 400 }}>{step.replace(/^  →\s*/, "").replace(/^  /, "")}</span>
                                      </div>
                                    );
                                  })}
                                </div>
                              </div>

                              <div style={{ background: "#fbbf2415", border: "1px solid #fbbf2430", borderRadius: 8, padding: "10px 14px", display: "flex", gap: 10 }}>
                                <span style={{ fontSize: 16 }}>⚡</span>
                                <div>
                                  <div style={{ fontSize: 10, color: "#fbbf24", fontWeight: 700, marginBottom: 3 }}>EXAM TIP</div>
                                  <div style={{ fontSize: "12px", color: "#fde68a", lineHeight: 1.55 }}>{method.tip}</div>
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ExamGuide />);
  </script>
</body>
</html>
